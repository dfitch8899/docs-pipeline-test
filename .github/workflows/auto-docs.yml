name: Auto Docs (Demo)

on:
  push:
    branches:
      - main
      - dfitch8899-docbot
  workflow_dispatch:

env:
  DOCS_DIR: docs

jobs:
  generate_docs:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------
      # 1. Checkout backend repo
      # ---------------------------------------------
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------
      # 2. Checkout frontend repo (dummy for demo)
      # ---------------------------------------------
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: dfitch8899/docs-pipeline-test   # your dummy frontend repo
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: flash-front

      # ---------------------------------------------
      # 3. Set up Python
      # ---------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---------------------------------------------
      # 4. Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------
      # 5. Generate docs
      # ---------------------------------------------
      - name: Generate docs
        run: python docs-bot/main.py
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}

      # ---------------------------------------------
      # 6. Show generated docs in logs (demo-friendly)
      # ---------------------------------------------
      - name: Preview generated docs
        run: |
          echo "=== GENERATED DOCS ==="
          ls -la docs || true
          for f in docs/*.md; do
            echo "----- $f -----"
            sed -n '1,120p' "$f"
          done

      # ---------------------------------------------
      # 7. Commit generated docs back to repo
      # ---------------------------------------------
      - name: Commit generated docs
        run: |
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Auto-generate docs from frontend/backend changes" || echo "No changes to commit"
