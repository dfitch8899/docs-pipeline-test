name: Auto Docs (Demo)
on:
  push:
    branches:
      - main
      - dfitch8899-docbot
  workflow_dispatch:
env:
  DOCS_DIR: docs
permissions:
  contents: write
jobs:
  generate_docs:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------
      # 1. Checkout backend repo
      # ---------------------------------------------
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      # ---------------------------------------------
      # 2. Load SSH deploy key
      # ---------------------------------------------
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.FRONTEND_DEPLOY_KEY }}
      # ---------------------------------------------
      # 3. Checkout frontend repo (private, SSH deploy key)
      # ---------------------------------------------
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: dfitch8899/flash-front-demo
          path: flash-front
          ref: main
      # ---------------------------------------------
      # 4. Set up Python
      # ---------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # ---------------------------------------------
      # 5. Install dependencies
      # ---------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      # ---------------------------------------------
      # 6. Generate docs
      # ---------------------------------------------
      - name: Generate docs
        run: python docs-bot/main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_AI_SUMMARY: "true"
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
      # ---------------------------------------------
      # 7. Preview generated docs in logs
      # ---------------------------------------------
      - name: Preview generated docs
        run: |
          echo "=== GENERATED DOCS ==="
          ls -la docs || true
          for f in docs/*.md; do
            echo "----- $f -----"
            sed -n '1,120p' "$f"
          done
      # ---------------------------------------------
      # 8. Commit and push generated docs back to repo
      # ---------------------------------------------
      - name: Commit generated docs
        run: |
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Auto-generate docs from frontend/backend changes" || echo "No changes to commit"
          git push
