name: Auto Docs & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCS_DIR: docs

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies (optional)
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping"
          fi

      # Identify changed MD files
      - name: Get changed doc files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- "${DOCS_DIR}" | grep '\.md$' || true)
          FILES=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Count: $(echo $FILES | wc -w)"

      # Dry-run publish
      - name: Publish to Confluence (dry run)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Would publish files:"
          echo "${{ steps.changed.outputs.files }}"
