name: Auto Docs & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCS_DIR: docs

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install markdown openai

      - name: Generate docs
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: python docs-bot/main.py

      - name: Get changed docs
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- docs | grep '\.md$' || true)
          FILES=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Publish to Confluence (dry run)
        if: steps.changed.outputs.files != ''
        env:
          CONFLUENCE_PARENT_PAGE_ID: "123456789"
        run: python scripts/publish_docs.py --files "${{ steps.changed.outputs.files }}"
