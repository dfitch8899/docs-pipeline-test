name: Auto Docs & Publish

on:
  push:
    branches:
      - backend
      - dfitch8899-docbot
  workflow_dispatch:

env:
  DOCS_DIR: docs

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      # Check if FRONTEND_REPO_TOKEN is available
      - name: Check secrets
        run: |
          echo "FRONTEND_REPO_TOKEN exists? ${FRONTEND_REPO_TOKEN:+yes}"

      # Checkout backend repo
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout frontend repo (test)
      - name: Checkout frontend (test)
        uses: actions/checkout@v4
        with:
          repository: dfitch8899/docs-pipeline-test
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: flash-front

      # Verify frontend checkout (proof)
      - name: Verify frontend checkout
        run: |
          echo "Frontend repo contents:"
          ls -la flash-front

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found — skipping"
          fi

      # Run docs-bot to detect changes and generate/update MD files
      - name: Generate docs
        run: python docs-bot/main.py

      # Identify changed MD files
      - name: Get changed doc files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- "${DOCS_DIR}" | grep '\.md$' || true)
          FILES=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Count: $(echo $FILES | wc -w)"

      # Publish to Confluence (dry run)
      - name: Publish to Confluence (dry run)
        if: steps.changed.outputs.files != ''
        run: |
          echo "Would publish files:"
          echo "${{ steps.changed.outputs.files }}"
