name: Auto Docs & Publish

on:
  push:
    branches:
      - backend
      - dfitch8899-docbot
  workflow_dispatch:

env:
  DOCS_DIR: docs

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      # Check if FRONTEND_REPO_TOKEN is available
      - name: Check secrets
        run: |
          echo "FRONTEND_REPO_TOKEN exists? ${FRONTEND_REPO_TOKEN:+yes}"

      # Checkout backend repo
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checkout frontend repo into subfolder
      - name: Checkout frontend
  uses: actions/checkout@v4
  with:
    repository: AI-OWL/flash-front
    token: ${{ secrets.FRONTEND_REPO_TOKEN }}
    path: flash-front


      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run docs-bot to detect changes and generate/update MD files
      - name: Generate docs
        run: python docs-bot/main.py

      # Identify changed MD files
      - name: Get changed doc files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- "${{ env.DOCS_DIR }}" | grep '\.md$' || true)
          FILES=$(echo "$FILES" | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Count: $(echo $FILES | wc -w)"

      # Publish to Confluence with AI summaries if enabled
      - name: Publish to Confluence
        if: steps.changed.outputs.files != ''
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_PARENT_PAGE_ID: ${{ secrets.CONFLUENCE_PARENT_PAGE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USE_AI_SUMMARY: ${{ vars.USE_AI_SUMMARY || 'true' }}
          FILES: ${{ steps.changed.outputs.files }}
        run: python scripts/publish_docs.py --files "$FILES"
